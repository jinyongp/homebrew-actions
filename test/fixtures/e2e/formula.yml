name: homebrew-tap-fixture
desc: End-to-end publishing fixture
homepage: https://github.com/jinyongp/homebrew-tap
license: MIT
install: |
  bin.mkpath
  (bin/"homebrew-tap-fixture").write "#!/bin/sh\necho homebrew-tap-fixture\n"
  chmod 0755, bin/"homebrew-tap-fixture"
test: |
  assert_equal "homebrew-tap-fixture\n", shell_output(bin/"homebrew-tap-fixture")
