name: GitHub Release fixture E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout immutable release fixture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jinyongp/release-fixture
          ref: v1.0.0
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve fixture commit
        id: source
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  generate:
    needs: resolve
    runs-on: macos-latest
    outputs:
      runner-matrix: ${{ steps.formula.outputs.runner-matrix }}
    steps:
      - name: Checkout candidate Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false

      - name: Checkout non-production tap baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jinyongp/homebrew-tap-fixture
          ref: main
          path: tap
          persist-credentials: false

      - name: Checkout immutable release fixture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jinyongp/release-fixture
          ref: ${{ needs.resolve.outputs.source-sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Generate GitHub Release Formula
        id: formula
        uses: ./automation/internal/formula
        with:
          tap-path: tap
          source-path: source
          formula: release-fixture
          repository: jinyongp/release-fixture
          ref: ${{ needs.resolve.outputs.source-sha }}
          version: v1.0.0
          spec-path: .github/homebrew/formula.yml
          validation-mode: release

      - name: Upload generated Formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-release-fixture-formula
          path: tap/Formula/release-fixture.rb
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: generate
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate.outputs.runner-matrix) }}
    steps:
      - name: Setup Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7 # main
        with:
          stable: true

      - name: Checkout candidate Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false

      - name: Checkout non-production tap baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jinyongp/homebrew-tap-fixture
          ref: main
          path: tap
          persist-credentials: false

      - name: Download generated Formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-release-fixture-formula
          path: tap/Formula

      - name: Validate GitHub Release Formula
        env:
          TAP_PATH: tap
          FORMULA: release-fixture
          VALIDATION_MODE: release
        run: bash automation/internal/scripts/validate-formula.sh

  homebrew-check:
    if: always()
    needs:
      - generate
      - validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false

      - name: Require successful Formula validation
        env:
          GENERATE_RESULT: ${{ needs.generate.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: bash automation/internal/scripts/require-formula-validation.sh
